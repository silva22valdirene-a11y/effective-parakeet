<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>JARVAS MAX | Assistente Virtual</title>
<!-- Biblioteca para interpretar Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050914;color:#eafaff;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #16415b;color:#00d9ff;font-weight:bold;letter-spacing:3px;font-size:22px}
main{max-width:800px;margin:auto;padding:24px 15px}
.hero{text-align:center;padding:35px 0}
.orb{width:120px;height:120px;border-radius:50%;margin:auto auto 25px;background:radial-gradient(circle at 35% 30%,white,#00d9ff 15%,#07529e 48%,#071020 72%);box-shadow:0 0 35px #00cfff,0 0 85px #0088ff55;animation:pulse 3s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 60px #00d9ff}}
h1{font-size:30px;margin:0 0 12px}
p{color:#91adbf;line-height:1.6}
.panel{border:1px solid #19415a;background:#081321;border-radius:16px;overflow:hidden}
#chat{height:350px;overflow:auto;padding:14px}
.msg{padding:12px 16px;margin:9px 0;border-radius:12px;overflow-wrap:anywhere;line-height:1.5}
.msg p{margin:4px 0}
.msg code{background:#050c17;padding:2px 6px;border-radius:4px;color:#00d9ff;font-family:monospace}
.msg pre{background:#050c17;padding:12px;border-radius:8px;border:1px solid #19415a;overflow-x:auto}
.msg pre code{padding:0;background:transparent}
.bot{background:#10263c}
.user{background:#06425b;margin-left:15%}
.controls{display:flex;gap:8px;padding:12px;border-top:1px solid #19415a}
input{flex:1;min-width:0;padding:13px;background:#050c17;color:white;border:1px solid #25465d;border-radius:10px}
button{background:#073d58;color:white;border:1px solid #087da5;border-radius:10px;padding:12px;cursor:pointer}
button:hover{border-color:#00d9ff}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
.small{text-align:center;font-size:12px;padding:15px;color:#91adbf}
@media(max-width:450px){.controls{flex-wrap:wrap}input{flex-basis:100%}}
</style>
</head>
<body>
<header>JARVAS MAX</header>
<main>
<section class="hero">
<div class="orb"></div>
<h1>Inteligência além dos limites.</h1>
<p>Seu assistente virtual futurista para ideias, conhecimento e tecnologia.</p>
</section>
<section class="panel">
<div id="chat">
<div class="msg bot">Olá! Sou o **JARVAS MAX**, seu assistente avançado. Como posso ajudar você hoje?</div>
</div>
<div class="quick">
<button onclick="preset('Me dê uma reflexão para hoje.')">Reflexão do dia</button>
<button onclick="preset('Me ajude a organizar minhas finanças.')">Finanças</button>
<button onclick="preset('Me ensine algo sobre tecnologia.')">Tecnologia</button>
</div>
<div class="controls">
<input id="entrada" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter')enviar()">
<button onclick="ouvir()">🎙️</button>
<button onclick="enviar()">Enviar</button>
</div>
